name: Test suite

# Runs the full Django test suite against a real Postgres service
# container on every push/PR — before this workflow, testing and
# deployment were entirely manual (`manage.py test`, `docker compose up
# --build`, by hand), with nothing catching a regression before it
# reached a deploy given the size of this suite (500+ tests as of
# writing).
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: redscribe
          POSTGRES_USER: redscribe
          POSTGRES_PASSWORD: redscribe-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Fixed dummy values, valid only for this ephemeral CI database —
      # never a real deployment secret. REDSCRIBE_ROOT_KEY must be
      # base64-encoded 32 bytes (see apps/crypto/root_key.py); this one
      # was generated once with `base64.b64encode(os.urandom(32))` and
      # has no significance beyond satisfying that format check.
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-real-use
      REDSCRIBE_ROOT_KEY: "8vJU64DX9ctPXDwXFIxX70IQv7shFGqC822bsAHEQms="
      POSTGRES_DB: redscribe
      POSTGRES_USER: redscribe
      POSTGRES_PASSWORD: redscribe-ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Matches Dockerfile's own apt-get list — postgresql-client for
      # apps.backup's pg_dump/pg_restore-shelling tests, the rest for
      # WeasyPrint (PDF report export).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            fonts-dejavu-core \
            shared-mime-info

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test
