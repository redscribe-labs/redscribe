{% extends "base/base.html" %}
{% block title %}Delete {{ template.title }} — Catalogue{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="card">
        <h1 class="text-xl font-bold text-slate-900 mb-2">Delete template?</h1>
        <p class="text-sm text-slate-600 mb-5">This permanently deletes "<strong>{{ template.title }}</strong>" from the catalogue. Findings previously copied from it are unaffected.</p>
        <form method="post" class="flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Delete</button>
            <a href="{% url 'catalogue:detail' template.pk %}" class="btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
