<div id="toast-container" class="fixed top-4 right-4 z-50 w-full max-w-sm flex flex-col gap-2">
    {% for message in messages %}
    <div class="toast toast-{{ message.tags|default:'info' }}" data-toast role="alert">
        <span class="toast-icon" aria-hidden="true">
            {% if message.tags == 'success' %}&check;{% elif message.tags == 'error' %}&times;{% elif message.tags == 'warning' %}!{% else %}i{% endif %}
        </span>
        <span class="flex-1">{{ message }}</span>
        <button type="button" class="toast-dismiss" data-toast-dismiss aria-label="Dismiss">&times;</button>
    </div>
    {% endfor %}
</div>
<script nonce="{{ request.csp_nonce }}">
    (function () {
        var AUTO_DISMISS_MS = 6000;
        var ICONS = { success: "&check;", error: "&times;", warning: "!", info: "i" };

        function dismiss(toast) {
            if (!toast.parentNode) return;
            toast.classList.add("toast-hide");
            setTimeout(function () { toast.remove(); }, 200);
        }

        function wire(toast) {
            var timer = setTimeout(function () { dismiss(toast); }, AUTO_DISMISS_MS);
            var btn = toast.querySelector("[data-toast-dismiss]");
            if (btn) {
                btn.addEventListener("click", function () {
                    clearTimeout(timer);
                    dismiss(toast);
                });
            }
        }

        function show(message, tag) {
            var container = document.getElementById("toast-container");
            if (!container) return;
            var toast = document.createElement("div");
            toast.className = "toast toast-" + (tag || "info");
            toast.setAttribute("data-toast", "");
            toast.setAttribute("role", "alert");
            toast.innerHTML =
                '<span class="toast-icon" aria-hidden="true">' + (ICONS[tag] || ICONS.info) + "</span>" +
                '<span class="flex-1"></span>' +
                '<button type="button" class="toast-dismiss" data-toast-dismiss aria-label="Dismiss">&times;</button>';
            toast.querySelector(".flex-1").textContent = message;
            container.appendChild(toast);
            wire(toast);
        }

        document.querySelectorAll("[data-toast]").forEach(wire);
        window.RedscribeToast = { show: show };
    })();
</script>
