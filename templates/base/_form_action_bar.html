<div class="sticky bottom-0 z-20 mt-8 flex items-center justify-between gap-4
            border-t border-slate-200 bg-slate-50 pt-4 pb-6">
    {% if cancel_url %}<a href="{{ cancel_url }}" class="text-sm text-slate-500 hover:text-brand-700 dark:hover:text-brand-300">&larr; {{ cancel_label|default:"Cancel" }}</a>{% else %}<span></span>{% endif %}
    <button type="submit" class="btn-primary">{{ submit_label }}</button>
</div>
