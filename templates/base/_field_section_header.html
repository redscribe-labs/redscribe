<div class="flex items-center gap-2 mb-3">
    <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md [&>svg]:h-4 [&>svg]:w-4
        {% if field_name == "vulnerability-description" %}bg-brand-50 text-brand-600 dark:bg-brand-950 dark:text-brand-300
        {% elif field_name == "business-impact" %}bg-amber-50 text-amber-600 dark:bg-amber-950 dark:text-amber-300
        {% elif field_name == "testing-summary" %}bg-bell-50 text-bell-600 dark:bg-bell-950 dark:text-bell-300
        {% elif field_name == "technical-details" %}bg-slate-100 text-slate-600 dark:bg-slate-200 dark:text-slate-600
        {% elif field_name == "recommendations" %}bg-green-50 text-green-600 dark:bg-green-950 dark:text-green-300
        {% elif field_name == "references" %}bg-navy-50 text-navy-600 dark:bg-navy-950 dark:text-navy-300
        {% else %}bg-slate-100 text-slate-500 dark:bg-slate-200 dark:text-slate-500{% endif %}">
        {% if field_name == "vulnerability-description" %}
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6.5a3 3 0 0 1 3 3v3a3 3 0 1 1-6 0v-3a3 3 0 0 1 3-3Z"/><path d="M10 6.5V5M7.5 8H4M12.5 8H16M7.5 12H4M12.5 12H16M8 4 7 3M12 4l1-1"/></svg>
        {% elif field_name == "business-impact" %}
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 17 16H3L10 3.5Z"/><path d="M10 8.5v3.5"/><circle cx="10" cy="14" r="0.75" fill="currentColor" stroke="none"/></svg>
        {% elif field_name == "testing-summary" %}
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h4"/><path d="M8.5 3v4.5L4.7 14a1.5 1.5 0 0 0 1.3 2.2h8a1.5 1.5 0 0 0 1.3-2.2L11.5 7.5V3"/><path d="M6.5 12h7"/></svg>
        {% elif field_name == "technical-details" %}
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5 3 10l4 5"/><path d="M13 5l4 5-4 5"/></svg>
        {% elif field_name == "recommendations" %}
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5a4.5 4.5 0 0 0-2.5 8.25c.4.3.5.6.5 1v.75h4v-.75c0-.4.1-.7.5-1A4.5 4.5 0 0 0 10 2.5Z"/><path d="M8 15h4M8.5 17h3"/></svg>
        {% elif field_name == "references" %}
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 11.5a3 3 0 0 0 4 .2l2-2a3 3 0 0 0-4.2-4.2l-1 1"/><path d="M11.5 8.5a3 3 0 0 0-4-.2l-2 2a3 3 0 0 0 4.2 4.2l1-1"/></svg>
        {% else %}
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="12" height="13" rx="1.5"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5"/></svg>
        {% endif %}
    </span>
    <h2 class="font-semibold text-slate-900 text-sm">{{ label }}</h2>
</div>
