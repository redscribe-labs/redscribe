<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Error{% endblock %} — RedScribe</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    @keyframes redscribe-cursor-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #111213;
        color: #f2f2f3;
    }
    .card {
        max-width: 30rem;
        width: 100%;
        text-align: center;
    }
    .wordmark {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 1.125rem;
        letter-spacing: -0.01em;
        color: #ffffff;
        margin-bottom: 2.5rem;
    }
    .wordmark span { color: #a7bebc; }
    .wordmark .cursor { color: rgba(138, 168, 166, 0.7); animation: redscribe-cursor-pulse 2s ease-in-out infinite; }
    .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 4.5rem;
        font-weight: 700;
        line-height: 1;
        color: #ffffff;
        margin: 0 0 0.75rem;
    }
    h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
        color: #ffffff;
    }
    p {
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #afb3b6;
        margin: 0 0 2rem;
    }
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.5rem 1.125rem;
        border-radius: 0.375rem;
        background: #527a52;
        color: #ffffff;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: background-color 0.15s;
    }
    .btn:hover { background: #3d5c3d; }
    .btn:focus-visible { outline: 2px solid #669966; outline-offset: 2px; }
</style>
</head>
<body>
    <div class="card">
        <p class="wordmark">Red<span>Scribe</span><span class="cursor">_</span></p>
        <p class="code">{% block code %}{% endblock %}</p>
        <h1>{% block heading %}{% endblock %}</h1>
        <p>{% block message %}{% endblock %}</p>
        <a href="{% block cta_url %}/{% endblock %}" class="btn">{% block cta_label %}Back to safety{% endblock %}</a>
    </div>
</body>
</html>
